[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rk3588-torch"
version = "0.4.0"
description = "Train PyTorch models with the Rockchip RK3588 NPU doing the matrix multiplies"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = ["torch>=2.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kenedii/rk3588-pytorch"

[project.scripts]
rk3588-torch = "rk3588_torch.__main__:main"

[tool.setuptools]
packages = ["rk3588_torch"]
